# Sobreposição de HOMOLOGAÇÃO da stack da GMN (stack gmn-hml; spec docs/specs/ci-deploy-and-seal-delivery.md §5.11; D-G0-12).
# Só o receptor de deploy do ambiente `homologacao` a usa, depois da aprovação no workflow .github/workflows/deploy.yml:
#   docker stack deploy --resolve-image never -c stack.yml -c stack-hml.yml gmn-hml
# Instalada pelo responsável em /opt/gmn-hml/ a partir do commit (o receptor confere o sha256). Produção NUNCA a usa.
#
# Só acrescenta o permitido (tests/deploy-config.test.ts, P9-H02 e P9-H09): a trava de homologação no web, o Serper desligado no web e
# no Worker, o Worker em 0 réplicas e os nomes gmn-hml_* dos secrets. Nenhuma porta, bind, rede ou imagem nova. O resto (pastas sob
# /srv/gmn-hml/, GMN_TRAEFIK_NAME=gmn-hml, GMN_HOST do domínio de homologação, laboratório Supabase) vem do arquivo de variáveis de
# homologação, conferido pelo receptor.
#
# Serper: `SERPER_API_KEY_FILE: ""` faz o entrypoint não carregar a chave. O secret gmn-hml_serper_api_key continua existindo (a lista
# de secrets do serviço não se remove por sobreposição) e guarda um texto fixo NÃO secreto.
# Secrets de topo: `external: true` repetido junto do `name:` de propósito. Se o Docker trocar a entrada inteira em vez de fundir os
# campos, o secret continua externo e com o nome de homologação (conferido no primeiro deploy, P9-H07).

services:
  gmn-web:
    environment:
      GMN_LINK_AUDIT_HOMOLOGATION: "1"
      SERPER_API_KEY_FILE: ""

  gmn-worker:
    environment:
      SERPER_API_KEY_FILE: ""
    deploy:
      replicas: 0

secrets:
  gmn_supabase_service_role:
    external: true
    name: gmn-hml_supabase_service_role
  gmn_supabase_anon:
    external: true
    name: gmn-hml_supabase_anon
  gmn_serper_api_key:
    external: true
    name: gmn-hml_serper_api_key
  gmn_redis_url:
    external: true
    name: gmn-hml_redis_url
  gmn_redis_password:
    external: true
    name: gmn-hml_redis_password
  gmn_redis_conf:
    external: true
    name: gmn-hml_redis_conf
  gmn_link_audit_origin_key:
    external: true
    name: gmn-hml_link_audit_origin_key
  gmn_link_audit_ledger_key:
    external: true
    name: gmn-hml_link_audit_ledger_key
  gmn_link_audit_log_key:
    external: true
    name: gmn-hml_link_audit_log_key
  gmn_link_audit_guard_db_url:
    external: true
    name: gmn-hml_link_audit_guard_db_url
  gmn_link_audit_guard_db_ca:
    external: true
    name: gmn-hml_link_audit_guard_db_ca
  gmn_link_audit_guard_key:
    external: true
    name: gmn-hml_link_audit_guard_key
