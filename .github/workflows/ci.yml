name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm' }
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm' }
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm' }
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  # P1 W4.6: artefato único do sign/close-key (spec docs/specs/link-audit-p1-attestation.md §5.5.1 itens 5–7; IA-03 artefato, IA-24).
  # Recompila com o esbuild travado no lockfile, confere o SHA-256 contra o versionado (build reprodutível) e roda o artefato sob
  # node --permission: env -i, node por caminho absoluto, grants estreitos, chave de teste gerada no próprio teste, assinatura completa num
  # pseudo-terminal (script) e recusas da barreira. LINK_AUDIT_ARTIFACT_STRICT=1: nada pode ser pulado. O teste recompila na própria pasta e
  # exige o mesmo hash versionado, então os bytes que ele executa são os do passo de build (mesmo SHA-256). Node 22: a linha da estação (W5); o
  # Node 24.22+ bloqueia fsync sob --permission e o artefato recusa cedo (SIGN_RUNTIME_NO_FSYNC). Por último, o upload do artefato e do hash.
  sign-artifact:
    name: sign artifact (build, hash, --permission)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'npm' }
      - name: Install
        run: npm ci
      - name: Build do artefato (esbuild travado, opções fixas, guardas sobre a saída)
        run: npm run link-audit:sign-artifact -- --out "$RUNNER_TEMP/sign-artifact"
      - name: Hash recompilado igual ao versionado
        run: cd "$RUNNER_TEMP/sign-artifact" && sha256sum -c "$GITHUB_WORKSPACE/docs/phase6-auditoria-link/p1-sign-artifact.sha256"
      - name: Artefato sob node --permission (env -i, pseudo-terminal; sign com grants estreitos e close-key com --allow-fs-read=/)
        env:
          LINK_AUDIT_ARTIFACT_STRICT: '1'
        run: node --require ./tests/register-typescript.cjs --test tests/link-audit-seal-sign-artifact.test.ts
      - name: Junta o hash versionado ao artefato
        run: cp docs/phase6-auditoria-link/p1-sign-artifact.sha256 "$RUNNER_TEMP/sign-artifact/"
      - name: Upload do artefato e do hash versionado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-audit-sign-artifact
          path: |
            ${{ runner.temp }}/sign-artifact/link-audit-sign.cjs
            ${{ runner.temp }}/sign-artifact/p1-sign-artifact.sha256
          if-no-files-found: error
          retention-days: 90

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lista os commits do PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks precisa do histórico completo
          persist-credentials: false
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SCA: npm audit com lista de exceções versionada (ver docs/how-to/ci-security-scans.md).
  # Bloqueia avisos high/critical que NÃO estejam em .github/security/npm-audit-exceptions.json.
  sca:
    name: sca (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: npm audit (JSON)
        # npm audit sai com código != 0 quando há avisos; quem decide é o gate abaixo.
        run: npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
      - name: Gate com exceções versionadas
        run: node .github/scripts/npm-audit-gate.mjs "$RUNNER_TEMP/npm-audit.json"

  # SAST: Semgrep OSS. BLOQUEANTE desde 16/11/2026: qualquer achado (todas as severidades) falha o job.
  # Critério cumprido e como tratar achados: docs/how-to/ci-security-scans.md.
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # semgrep/semgrep:1.185.0, fixada pelo digest do índice multi-arquitetura (conferido no Docker Hub em
      # 16/11/2026; config da imagem: release-1.185.0, revisão 7c70dec4). Atualizar: how-to acima.
      SEMGREP_IMAGE: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Semgrep (falha com qualquer achado)
        # Checkout montado só para leitura. A imagem roda como root e o checkout é do usuário do runner:
        # safe.directory (escopo de linha de comando via GIT_CONFIG_*) deixa o Semgrep listar os arquivos pelo git.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --metrics=off --disable-version-check --error \
              --config p/typescript --config p/javascript --config p/react --config p/nodejs \
              --config p/github-actions \
              --exclude node_modules --exclude .next --exclude tests --exclude docs \
              src scripts deploy .github
